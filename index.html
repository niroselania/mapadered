<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedMapa</title>
  <style>
    :root { --ink:#172033; --muted:#68738a; --line:#dfe5ef; --blue:#246bfd; --bg:#f5f7fb; --panel:#fff; --green:#1dba76; --orange:#f29b38; --red:#e15151; }
    * { box-sizing:border-box } body { margin:0; font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--bg); overflow:hidden }
    button,select,input { font:inherit } button { cursor:pointer; border:0 } header { height:62px; background:#172033; color:#fff; display:flex; align-items:center; gap:22px; padding:0 24px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:750; letter-spacing:-.3px; font-size:17px }.mark { width:29px;height:29px;display:grid;place-items:center;background:var(--blue);border-radius:8px;font-size:17px }
    .sites { display:flex; align-self:stretch; margin-left:18px }.site { background:transparent;color:#b9c5db;padding:0 18px;border-bottom:3px solid transparent;font-weight:650 }.site.active { color:#fff;border-color:#62a0ff }
    .header-actions{margin-left:auto;display:flex;gap:9px}.header-actions button{padding:8px 12px;border-radius:7px;background:#2b3852;color:#fff}.header-actions .primary{background:var(--blue)}
    main { height:calc(100vh - 62px); display:grid; grid-template-columns:230px 1fr 270px; }
    aside { background:var(--panel); border-right:1px solid var(--line); padding:18px 14px; overflow:auto }.right { border-right:0;border-left:1px solid var(--line) }
    h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px;margin:7px 7px 12px }.palette { display:grid;gap:7px }.tool { display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;background:#f8faff;color:var(--ink);text-align:left;border:1px solid transparent }.tool:hover { border-color:#bcd0fb;background:#eef4ff }.tool .ico { font-size:20px;width:28px;text-align:center }.hint { margin:20px 7px;color:var(--muted);font-size:12px;line-height:1.5 }
    .canvas-wrap { position:relative; overflow:hidden; background-color:#f8faff; background-image:radial-gradient(#dbe3f0 1px,transparent 1px);background-size:20px 20px }.canvas-title { position:absolute;top:18px;left:20px;z-index:4;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;box-shadow:0 2px 8px #233a6220 }.canvas-title strong{display:block}.canvas-title span{color:var(--muted);font-size:12px}
    #board { width:100%;height:100%;position:relative;min-width:700px; transform-origin:0 0 }.node { width:122px;position:absolute;z-index:2;background:#fff;border:1px solid #cfd8e7;border-radius:10px;padding:9px 8px;box-shadow:0 3px 10px #263b5d1d;text-align:center;user-select:none;touch-action:none }.node.selected{border:2px solid var(--blue);box-shadow:0 0 0 3px #246bfd26}.node .nicon{font-size:28px;line-height:31px}.node .nname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .nip{font-size:11px;color:var(--muted);margin-top:2px}.node .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}.node.offline .dot{background:var(--red)}
    #links { position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none }.link { stroke:#8aa1c5;stroke-width:2.2 }.link.selected{stroke:var(--blue);stroke-width:3 }.link-label{fill:#60708a;font-size:11px;paint-order:stroke;stroke:#f8faff;stroke-width:4px;stroke-linejoin:round}
    .panel-empty { color:var(--muted);font-size:13px;line-height:1.5;padding:8px }.field { margin:0 7px 13px }.field label { display:block;font-size:12px;font-weight:650;margin-bottom:5px }.field input,.field select { width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;color:var(--ink) }.status-row { display:flex;gap:7px;margin:0 7px 16px }.status { padding:7px 9px;border-radius:6px;flex:1;background:#f0f3f8;color:var(--muted) }.status.on { background:#dcf7e9;color:#107447 }.delete { width:calc(100% - 14px);margin:7px;padding:9px;background:#fff0f0;color:#bd3030;border:1px solid #ffc9c9;border-radius:7px;font-weight:650 }
    .connection{padding:10px 7px;border-top:1px solid var(--line);margin-top:12px}.connection button{width:100%;padding:9px;border-radius:7px;background:#eaf1ff;color:#1554d4;font-weight:650}.connection button.disconnect{margin-top:7px;background:#fff0f0;color:#bd3030}.mode{display:none;margin:8px 7px;padding:8px;background:#fff4de;color:#95610c;border-radius:6px;font-size:12px}.mode.show{display:block}.bottom {position:absolute;bottom:16px;left:20px;z-index:4;display:flex;gap:6px}.bottom button{width:32px;height:32px;border-radius:7px;background:#fff;border:1px solid var(--line);font-size:17px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
    @media(max-width:850px){main{grid-template-columns:190px 1fr}.right{display:none}header{padding:0 12px}.sites{margin-left:0}.site{padding:0 9px}.header-actions button:not(.primary){display:none}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark">⌘</div> RedMapa</div><nav class="sites"><button class="site active" data-site="casa">⌂ Casa</button><button class="site" data-site="deposito">▣ Depósito</button></nav><div class="header-actions"><button id="importBtn">Importar</button><button id="exportBtn">Exportar</button><button class="primary" id="saveBtn">Guardar mapa</button></div></header>
  <main>
    <aside><h3>Agregar equipo</h3><div class="palette" id="palette"></div><p class="hint">Elegí un equipo y hacé clic en el plano para colocarlo. Arrastrá los equipos para ordenarlos.</p><div class="connection"><button id="linkBtn">↔ Conectar equipos</button><button class="disconnect" id="unlinkBtn">⊘ Desconectar equipos</button><div class="mode" id="linkMode"></div></div></aside>
    <section class="canvas-wrap"><div class="canvas-title"><strong id="mapName">Red de Casa</strong><span id="summary">0 equipos · 0 conexiones</span></div><div class="bottom"><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomReset" aria-label="Restablecer zoom">⟳</button><button id="zoomIn" aria-label="Acercar">+</button></div><div id="board"><svg id="links" aria-label="Conexiones de red"></svg></div></section>
    <aside class="right"><h3>Propiedades</h3><div id="properties" class="panel-empty">Seleccioná un equipo para editar sus datos.</div></aside>
  </main><input type="file" id="fileInput" accept="application/json" hidden><div class="toast" id="toast"></div>
  <script>
  const TYPES=[['router','📡','Router'],['switch','🔀','Switch'],['server','🖥️','Servidor'],['pc','💻','PC / Terminal'],['printer','🖨️','Impresora'],['camera','📷','Cámara IP'],['wifi','📶','Punto Wi‑Fi'],['nas','🗄️','NAS / Almacenamiento']];
  const defaultMaps={casa:{nodes:[{id:'r1',type:'router',name:'Router principal',ip:'192.168.1.1',x:300,y:180,status:'online'},{id:'w1',type:'wifi',name:'Wi‑Fi living',ip:'192.168.1.2',x:520,y:120,status:'online'},{id:'p1',type:'pc',name:'PC oficina',ip:'192.168.1.20',x:540,y:300,status:'online'}],links:[['r1','w1'],['r1','p1']]},deposito:{nodes:[{id:'r2',type:'router',name:'Router depósito',ip:'192.168.10.1',x:300,y:180,status:'online'},{id:'c1',type:'camera',name:'Cámara entrada',ip:'192.168.10.30',x:520,y:120,status:'online'},{id:'t1',type:'pc',name:'Terminal stock',ip:'192.168.10.20',x:520,y:300,status:'online'}],links:[['r2','c1'],['r2','t1']]}};
  let maps=defaultMaps, site='casa', selected=null, adding=null, linking=null, linkAction=null, zoom=1;
  const board=document.querySelector('#board'),svg=document.querySelector('#links'),palette=document.querySelector('#palette'),prop=document.querySelector('#properties');
  palette.innerHTML=TYPES.map(([type,icon,label])=>`<button class="tool" data-type="${type}"><span class="ico">${icon}</span>${label}</button>`).join('');
  function typeInfo(t){return TYPES.find(x=>x[0]===t)||TYPES[3]} function map(){return maps[site]} function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  function render(){board.querySelectorAll('.node').forEach(n=>n.remove());let m=map();m.nodes.forEach(n=>{let [,icon]=typeInfo(n.type),el=document.createElement('div');el.className='node '+(n.status==='offline'?'offline ':'')+(selected===n.id?'selected':'');el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.innerHTML=`<div class="nicon">${icon}</div><div class="nname">${esc(n.name)}</div><div class="nip"><span class="dot"></span>${esc(n.ip||'Sin IP')}</div>`;board.append(el);bindNode(el,n)});drawLinks();document.querySelector('#mapName').textContent=site==='casa'?'Red de Casa':'Red de Depósito';document.querySelector('#summary').textContent=`${m.nodes.length} equipos · ${m.links.length} conexiones`;document.querySelectorAll('.site').forEach(b=>b.classList.toggle('active',b.dataset.site===site));renderProps()}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function drawLinks(){let m=map(),ns=Object.fromEntries(m.nodes.map(n=>[n.id,n]));svg.innerHTML=m.links.map(([a,b])=>{let x=ns[a],y=ns[b];if(!x||!y)return '';let x1=x.x+61,y1=x.y+35,x2=y.x+61,y2=y.y+35;return `<line class="link" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join('')}
  function bindNode(el,n){let start,orig,drag=false;el.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};orig={x:n.x,y:n.y};el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>3)drag=true;n.x=Math.max(0,orig.x+dx/zoom);n.y=Math.max(0,orig.y+dy/zoom);el.style.left=n.x+'px';el.style.top=n.y+'px';drawLinks()});el.addEventListener('pointerup',()=>{if(!start)return;start=null;if(!drag)selectNode(n.id);drag=false;save(false)})}
  function selectNode(id){if(Array.isArray(linking)){linking.push(id);if(linking.length===2){let [a,b]=linking,exists=map().links.some(l=>l.includes(a)&&l.includes(b));if(a===b)toast('Elegí dos equipos distintos');else if(linkAction==='add'&&!exists){map().links.push([a,b]);toast('Conexión creada')}else if(linkAction==='remove'&&exists){map().links=map().links.filter(l=>!(l.includes(a)&&l.includes(b)));toast('Conexión eliminada')}else toast(linkAction==='add'?'Los equipos ya están conectados':'No existe una conexión entre esos equipos');linking=null;linkAction=null;document.querySelector('#linkMode').classList.remove('show');save(false)}else{toast('Ahora elegí el segundo equipo')}render();return}selected=id;render()}
  function renderProps(){let n=map().nodes.find(x=>x.id===selected);if(!n){prop.className='panel-empty';prop.textContent='Seleccioná un equipo para editar sus datos.';return}prop.className='';let opts=TYPES.map(([t,,l])=>`<option value="${t}" ${n.type===t?'selected':''}>${l}</option>`).join('');prop.innerHTML=`<div class="field"><label>Nombre</label><input id="pn" value="${esc(n.name)}"></div><div class="field"><label>Tipo</label><select id="pt">${opts}</select></div><div class="field"><label>Dirección IP</label><input id="pi" value="${esc(n.ip||'')}"></div><div class="field"><label>Estado</label><select id="ps"><option value="online" ${n.status==='online'?'selected':''}>En línea</option><option value="offline" ${n.status==='offline'?'selected':''}>Fuera de línea</option></select></div><button class="delete" id="deleteBtn">Eliminar equipo</button>`;
    const refreshNode=()=>{let el=board.querySelector(`[data-id="${n.id}"]`);if(!el)return;el.querySelector('.nname').textContent=n.name;el.querySelector('.nip').innerHTML=`<span class="dot"></span>${esc(n.ip||'Sin IP')}`};
    document.querySelector('#pn').addEventListener('input',e=>{n.name=e.target.value;refreshNode();save(false)});
    document.querySelector('#pi').addEventListener('input',e=>{n.ip=e.target.value;refreshNode();save(false)});
    document.querySelector('#pt').addEventListener('change',e=>{n.type=e.target.value;render();save(false)});
    document.querySelector('#ps').addEventListener('change',e=>{n.status=e.target.value;render();save(false)});
    document.querySelector('#deleteBtn').onclick=()=>{map().nodes=map().nodes.filter(x=>x.id!==n.id);map().links=map().links.filter(l=>!l.includes(n.id));selected=null;render();save(false)}}
  palette.onclick=e=>{let b=e.target.closest('[data-type]');if(!b)return;adding=b.dataset.type;palette.querySelectorAll('.tool').forEach(x=>x.style.outline='');b.style.outline='2px solid #246bfd';toast('Ahora hacé clic en el plano')};
  board.addEventListener('click',e=>{if(e.target!==board||!adding)return;let r=board.getBoundingClientRect(),i=map().nodes.length+1;map().nodes.push({id:'n'+Date.now(),type:adding,name:typeInfo(adding)[2]+' '+i,ip:'',x:(e.clientX-r.left)/zoom-61,y:(e.clientY-r.top)/zoom-35,status:'online'});adding=null;palette.querySelectorAll('.tool').forEach(x=>x.style.outline='');render();save(false)});
  function startLinkMode(action){linking=[];linkAction=action;selected=null;let hint=document.querySelector('#linkMode');hint.textContent=action==='add'?'Elegí dos equipos para crear el enlace.':'Elegí los dos equipos que querés desconectar.';hint.classList.add('show');render()}
  document.querySelector('#linkBtn').onclick=()=>startLinkMode('add');document.querySelector('#unlinkBtn').onclick=()=>startLinkMode('remove');document.querySelectorAll('.site').forEach(b=>b.onclick=()=>{site=b.dataset.site;selected=null;adding=null;linking=null;linkAction=null;document.querySelector('#linkMode').classList.remove('show');render()});
  async function save(show=true){localStorage.setItem('redmapa-v1',JSON.stringify(maps));try{let r=await fetch('/api/maps',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(maps)});if(!r.ok)throw new Error();if(show)toast('Mapa guardado para todos los dispositivos')}catch{if(show)toast('No se pudo guardar en el servidor')}}document.querySelector('#saveBtn').onclick=()=>save();
  document.querySelector('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(maps,null,2)],{type:'application/json'}));a.download='redmapa-respaldo.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#importBtn').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.casa||!d.deposito)throw 0;maps=d;selected=null;render();save(false);toast('Mapa importado')}catch{toast('El archivo no es válido')}};r.readAsText(f)};
  async function loadSharedMap(){try{let r=await fetch('/api/maps'),data=await r.json();if(data.casa&&data.deposito){maps=data;selected=null;render();toast('Mapa compartido cargado');return}}catch{}let saved=localStorage.getItem('redmapa-v1');if(saved){try{let local=JSON.parse(saved);if(local.casa&&local.deposito){maps=local;render();save(false);toast('Mapa anterior migrado al servidor')}}catch{}}}
  function setZoom(z){zoom=Math.max(.6,Math.min(1.5,z));board.style.transform=`scale(${zoom})`}document.querySelector('#zoomIn').onclick=()=>setZoom(zoom+.1);document.querySelector('#zoomOut').onclick=()=>setZoom(zoom-.1);document.querySelector('#zoomReset').onclick=()=>setZoom(1);render();loadSharedMap();
  </script>
</body>
</html>
